# Driver `local`: rota solo (5 archivos de 20 MB por contenedor, comprimidos).
# El `json-file` por defecto crece sin límite y, en un PC que corre meses,
# termina llenando el disco.
x-logging: &logging
  logging:
    driver: local

services:
  db:
    image: postgres:18-alpine
    container_name: torn_db
    <<: *logging
    restart: always
    environment:
      # Se leen del .env, que no se versiona. Son las mismas TORN_DB_* que usa
      # el backend, así que no pueden desincronizarse.
      #
      # Ojo: PostgreSQL sólo aplica estos valores al inicializar el volumen. Si
      # cambias la contraseña sobre un volumen ya creado, la base conserva la
      # anterior y el backend deja de conectar.
      POSTGRES_USER: ${TORN_DB_USER:?define TORN_DB_USER en tu .env}
      POSTGRES_PASSWORD: ${TORN_DB_PASSWORD:?define TORN_DB_PASSWORD en tu .env}
      POSTGRES_DB: ${TORN_DB_NAME:?define TORN_DB_NAME en tu .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: torn_backend
    <<: *logging
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TORN_DB_HOST: db
      # dte-torn corre en su propio compose (dte-torn/) y publica la API en el
      # puerto 8001 del host.
      TORN_DTE_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Este compose es el entorno de desarrollo: `dev` levanta el servidor de
      # Next con recarga en caliente. Para producción se construye con
      # `--target runner` y NEXT_PUBLIC_API_URL como --build-arg, porque Next
      # incrusta las NEXT_PUBLIC_* en el bundle al compilar.
      target: dev
    container_name: torn_frontend
    <<: *logging
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: