services:
  db:
    image: postgres:18-alpine
    container_name: torn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: torn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: torn_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TORN_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Este compose es el entorno de desarrollo: `dev` levanta el servidor de
      # Next con recarga en caliente. Para producción se construye con
      # `--target runner` y NEXT_PUBLIC_API_URL como --build-arg, porque Next
      # incrusta las NEXT_PUBLIC_* en el bundle al compilar.
      target: dev
    container_name: torn_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: