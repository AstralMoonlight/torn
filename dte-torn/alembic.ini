[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; La URL sale de DTE_DATABASE_OWNER_URL en alembic/env.py: las migraciones
; corren con el rol dueño, no con el rol de la aplicación (que no puede crear
; políticas ni saltarse RLS).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
