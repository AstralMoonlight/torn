name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        # La suite corre sobre SQLite en memoria; no necesita PostgreSQL.
        env:
          TORN_AUTO_CREATE_TABLES: "0"
          SECRET_KEY: ci-secret-key
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        # Informativo por ahora: el código arrastra 56 errores de lint previos
        # (sobre todo `no-explicit-any` en la capa de servicios). Se limpian en
        # #37 y entonces esto vuelve a ser bloqueante. El gate real es el build.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
