[pytest]
# La suite vive en tests/ y corre sobre SQLite, sin necesidad de PostgreSQL.
#
# Sin esta restricción, un `pytest` a secas desde la raíz también recoge los
# test_*.py sueltos del directorio raíz (test_roles.py, test_sale.py,
# test_jwt_auth.py, test_provisioning.py, test_user_limits.py), que son scripts
# manuales anteriores al modelo multi-tenant: abren conexión a PostgreSQL al
# importarse y rompen la recolección. Su destino se decide en #35.
testpaths = tests
